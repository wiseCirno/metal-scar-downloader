name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*', '[0-9]*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  version:
    name: Check release version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - name: Validate application version and tag
        id: version
        run: python scripts/package-release.py --check-version

  build:
    name: Build (${{ matrix.name }})
    needs: version
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: --no-bundle
            format: windows
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: --bundles dmg
            format: macos
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: --bundles appimage,deb,rpm
            format: linux
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      CARGO_TERM_COLOR: always
      TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}
      NETEASE_RUNTIME_TARGET: ${{ matrix.target }}
      APPIMAGE_EXTRACT_AND_RUN: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 10
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2.9.3
        with:
          workspaces: ./src -> target
          key: ${{ matrix.target }}
      - name: Cache embedded Node archives
        uses: actions/cache@v6.1.0
        with:
          path: .local-validation/netease-node
          key: embedded-node-${{ matrix.target }}-${{ hashFiles('scripts/prepare-netease-api.mjs') }}
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 xdg-utils
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Build desktop packages
        run: pnpm exec tauri build --config src/tauri.conf.json --target ${{ matrix.target }} ${{ matrix.bundles }}
      - name: Run Rust tests
        run: cargo test --locked --manifest-path src/Cargo.toml --target ${{ matrix.target }} --lib
      - name: Test embedded runtime extraction and worker
        run: cargo test --locked --manifest-path src/Cargo.toml --target ${{ matrix.target }} --lib bundled_worker_health_offline -- --ignored
      - name: Check embedded runtime on runner
        run: python scripts/package-release.py --check-runtime --target ${{ matrix.target }}
      - name: Package release assets and checksums
        run: python scripts/package-release.py --target ${{ matrix.target }} --format ${{ matrix.format }}
      - name: Upload packages
        uses: actions/upload-artifact@v7.0.2
        with:
          name: metal-scar-downloader-${{ needs.version.outputs.version }}-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [ version, build ]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate combined checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.zip *.dmg *.AppImage *.deb *.rpm > SHA256SUMS.txt
      - name: Publish all platform packages
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/*.zip
            release-assets/*.dmg
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.rpm
            release-assets/*SHA256SUMS.txt
