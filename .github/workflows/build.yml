name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --bundles dmg
            artifact: metal-scar-downloader_${{ github.ref_name }}_macos_aarch64.dmg

          - name: macOS (Intel)
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --bundles dmg
            artifact: metal-scar-downloader_${{ github.ref_name }}_macos_x64.dmg

          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: --no-bundle
            artifact: metal-scar-downloader_${{ github.ref_name }}_windows_x64.zip
            exeName: 铁痕电台下载器.exe

          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: --no-bundle
            artifact: metal-scar-downloader_${{ github.ref_name }}_linux_x64.tar.gz

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src -> target

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build Tauri app
        run: pnpm tauri build --target ${{ matrix.target }} ${{ matrix.args }}
        env:
          CI: ${{ runner.os == 'macOS' && 'false' || 'true' }}
          TAURI_ENV_TARGET_TRIPLE: ${{ matrix.target }}

      - name: Prepare macOS artifact
        if: runner.os == 'macOS'
        run: |
          DMG=$(find src/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -1)
          cp "$DMG" "${{ matrix.artifact }}"

      - name: Prepare Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src/target/${{ matrix.target }}/release/*.exe" | Select-Object -First 1
          Copy-Item -LiteralPath $exe.FullName -Destination "${{ matrix.exeName }}"
          Compress-Archive -LiteralPath "${{ matrix.exeName }}" -DestinationPath "${{ matrix.artifact }}"

      - name: Prepare Linux artifact
        if: runner.os == 'Linux'
        run: tar -czf "${{ matrix.artifact }}" -C "src/target/${{ matrix.target }}/release" metal-scar-downloader

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ matrix.artifact }}

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: v${{ github.ref_name }}
          body: |
            ## 新增
            - 新增内容
            
            ## 优化
            - 优化内容

            ## 修复
            - 修复内容
          draft: true
          files: |
            *.dmg
            *.zip
            *.tar.gz
